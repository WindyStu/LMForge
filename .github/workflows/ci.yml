name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""
  PYTHONUTF8: "1"
  UV_PYTHON: "3.12"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --locked --dev

      - name: Check repository hygiene
        run: uv run python scripts/check_repository_hygiene.py

      - name: Lint Python
        run: uv run ruff check src/lmforge/reproducibility.py scripts/check_repository_hygiene.py tests/test_reproducibility.py tests/test_repository_hygiene.py tests/test_ci.py

      - name: Check infrastructure formatting
        run: >-
          uv run ruff format --check
          src/lmforge/reproducibility.py
          scripts/check_repository_hygiene.py
          tests/test_reproducibility.py
          tests/test_repository_hygiene.py
          tests/test_ci.py

      - name: Smoke installed CLI
        run: |
          uv run lmforge --help
          uv run lmforge prepare --help
          uv run lmforge train --help
          uv run lmforge generate --help

      - name: Run CPU tests
        run: uv run pytest -q
