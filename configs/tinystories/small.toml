[tokenizer]
vocab = "../../artifacts/demo-tokenizer/vocab.json"
merges = "../../artifacts/demo-tokenizer/merges.json"
special_tokens = ["<|endoftext|>"]
vocab_size = 1000

[[prepare.datasets]]
input = "../../tests/fixtures/tinystories_sample_5M.txt"
output = "../../artifacts/demo-data/train.npy"

[[prepare.datasets]]
input = "../../tests/fixtures/tinystories_sample.txt"
output = "../../artifacts/demo-data/valid.npy"

[data]
train = "../../artifacts/demo-data/train.npy"
validation = "../../artifacts/demo-data/valid.npy"

[model]
vocab_size = 1000
context_length = 128
d_model = 128
num_layers = 2
num_heads = 4
d_ff = 352
rope_theta = 10000.0

[training]
max_steps = 1000
batch_size = 2
grad_accum_steps = 8
max_lr = 0.0003
min_lr = 0.00003
warmup_steps = 50
lr_decay_steps = 1000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
eps = 1e-8
max_grad_norm = 1.0
eval_interval = 100
eval_batches = 10
save_interval = 100
log_interval = 10
seed = 42

[runtime]
device = "cpu"
precision = "float32"
output_dir = "../../artifacts/demo-run"
