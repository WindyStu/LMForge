[tokenizer]
vocab = "../../artifacts/tinystories-p1/tokenizer/vocab.json"
merges = "../../artifacts/tinystories-p1/tokenizer/merges.json"
special_tokens = ["<|endoftext|>"]
vocab_size = 8192

[[prepare.datasets]]
input = "/mnt/d/data/OpenWebText/TinyStoriesV2-GPT4-train.txt"
output = "../../artifacts/tinystories-p1/data/train.npy"

[[prepare.datasets]]
input = "/mnt/d/data/OpenWebText/TinyStoriesV2-GPT4-valid.txt"
output = "../../artifacts/tinystories-p1/data/validation.npy"

[data]
train = "../../artifacts/tinystories-p1/data/train.npy"
validation = "../../artifacts/tinystories-p1/data/validation.npy"

[model]
vocab_size = 8192
context_length = 256
d_model = 256
num_layers = 4
num_heads = 4
d_ff = 768
rope_theta = 10000.0

[training]
max_steps = 60
batch_size = 4
grad_accum_steps = 8
max_lr = 0.0003
min_lr = 0.00003
warmup_steps = 50
lr_decay_steps = 10000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
eps = 1e-8
max_grad_norm = 1.0
eval_interval = 10
eval_batches = 10
save_interval = 10
log_interval = 1
seed = 42

[runtime]
device = "cuda"
precision = "float32"
deterministic = true
output_dir = "../../artifacts/tinystories-p1/smoke/uninterrupted"
